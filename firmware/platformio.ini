[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps =
  bblanchon/ArduinoJson@^7.0.0
build_flags =
  -DCORE_DEBUG_LEVEL=0

[env:esp32dev_http]
board = esp32dev
build_flags =
  ${env.build_flags}
  -DTRANSPORT_HTTP=1

[env:esp32dev_serial]
board = esp32dev
build_flags =
  ${env.build_flags}
  -DTRANSPORT_SERIAL=1

; Bench rig: an M5Stack Fire with the front-panel buttons standing in for the
; lane sensors, so the whole pipeline can be exercised on real hardware before
; sensors are wired. Identical firmware; only config.h differs — copy
; include/config.m5fire.example.h over include/config.h.
[env:m5fire_http]
board = m5stack-fire
build_flags =
  ${env.build_flags}
  -DTRANSPORT_HTTP=1

[env:m5fire_serial]
board = m5stack-fire
build_flags =
  ${env.build_flags}
  -DTRANSPORT_SERIAL=1
